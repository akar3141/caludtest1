name: Bitcoin Daily Report

on:
  schedule:
    # 21:00 Asia/Tehran = 17:30 UTC

    - cron: "30 17 * * *"
    - cron: "45 17 * * *"
    - cron: "0 18 * * *"
    - cron: "15 18 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Bypass time gate"
        type: boolean
        default: false

      dry_run:
        description: "Run without sending Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bitcoin-daily-report
  cancel-in-progress: false

jobs:
  report:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bitcoin daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          STATE_FILE_PATH: data/state_bitcoin_daily.json
          PYTHONPATH: src
        run: |
          python -m bot.main --asset bitcoin --mode daily \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated state
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state_bitcoin_daily.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "chore: update bitcoin daily state"

          git pull --rebase origin main

          git push
