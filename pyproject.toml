[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-report-bot"
version = "1.0.0"
description = "Automated Telegram market reports for Gold, Dow Jones and Bitcoin."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
